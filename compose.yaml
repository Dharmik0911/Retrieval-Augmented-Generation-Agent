x-common: &common
  image: aviation-self-rag:local
  build:
    context: .
  env_file:
    - .env
  init: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,size=512m,mode=1777

services:
  chatbot:
    <<: *common
    ports:
      - "127.0.0.1:7860:7860"
    volumes:
      - type: bind
        source: ./documents
        target: /app/documents
        read_only: true
      - type: volume
        source: rag_data
        target: /app/data
        read_only: true
    restart: unless-stopped

  ingest:
    <<: *common
    profiles: [tools]
    command: ["python", "ingest.py"]
    volumes:
      - type: bind
        source: ./documents
        target: /app/documents
        read_only: true
      - type: volume
        source: rag_data
        target: /app/data

  evaluate:
    <<: *common
    profiles: [tools]
    command: ["python", "evaluate.py"]
    volumes:
      - type: bind
        source: ./documents
        target: /app/documents
        read_only: true
      - type: volume
        source: rag_data
        target: /app/data
        read_only: true
      - type: volume
        source: evaluation_results
        target: /app/runs

volumes:
  rag_data:
  evaluation_results:
